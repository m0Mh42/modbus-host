; PlatformIO Project Configuration
; Thermocontroller - GD32F303RCT6
;
; Hardware summary:
;   - MCU:        GD32F303RCT6 (Cortex-M4, 64-pin)
;   - Temp:       8x thermocouple via 2x ADS1220 (SPI1)
;   - Current:    8x current-transformer analog inputs (on-chip ADC)
;   - Proximity:  2x digital inputs (meterage / speed)
;   - Relays:     16x outputs (heater / blower) via ULN2803
;   - Comms:      USART2 -> MAX485 -> Modbus RTU

[platformio]
default_envs = gd32f303rc
src_dir = src
include_dir = include

[env:gd32f303rc]
; Community GD32 platform (maxgerhardt). Run once:
;   pio pkg install -p https://github.com/CommunityGD32Cores/platform-gd32.git
platform = https://github.com/CommunityGD32Cores/platform-gd32.git
framework = spl
board = genericGD32F303RC

; nanoMODBUS - compact Modbus RTU/TCP server/client (hardware-agnostic C).
; Pulled from GitHub; integration is just the two transport callbacks we wire
; up in src/comm/modbus_rtu.c.
lib_deps =
    https://github.com/debevv/nanoMODBUS.git

build_flags =
    -Iinclude
    -Isrc/hal
    -Isrc/drivers/ads1220
    -Isrc/drivers/relay
    -Isrc/drivers/proximity
    -Isrc/drivers/cs1237
    -Isrc/drivers/ds18b20
    -Isrc/app
    -Isrc/comm
    -Wall
    -Wextra

; --- Upload / Debug ---
upload_protocol = stlink
debug_tool = stlink

monitor_speed = 115200

[env:native]
platform = native
build_flags =
    -Iinclude
    -Isrc/app
    -Isrc/comm
    -Isrc/drivers/relay
    -DUNIT_TEST
